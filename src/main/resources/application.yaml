server:
  port: 8080
spring:
  application:
    name: accounts
    datasource:
      url: jdbc:h2:mem:testdb
      driverClassName: org.h2.Driver
      username: sa
      password: ''
    h2:
      console:
        enabled: true
      jpa:
        database-platform: org.hibernate.dilect.H2Dialect
        hibernate:
          ddl-auto: update
        show-sql: true
